{% extends 'base.html' %}
{% block content %}
<div class="card auth-box">
    <h2>Iniciar Sesión</h2>
    <p style="font-size:0.85rem; color:#94a3b8;">Demo Admin: usuario <b>admin</b> | clave <b>123</b></p>
    <form method="POST">
        <div class="form-group">
            <label>Usuario</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn" style="width:100%;">Ingresar</button>
    </form>
    <p style="margin-top:15px; text-align:center;">
        ¿No tienes cuenta? <a href="{{ url_for('register') }}" style="color:#38bdf8;">Regístrate aquí</a>
    </p>
</div>
{% endblock %}
