{% extends 'base.html' %}
{% block content %}
<div class="card auth-box">
    <h2>Registro de Cadete / Admin</h2>
    <form method="POST">
        <div class="form-group">
            <label>Nombre de Usuario</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" required>
        </div>
        <div class="form-group">
            <label>Rol en el Sistema</label>
            <select name="rol">
                <option value="astronauta">Astronauta Junior (Juega y guarda misiones)</option>
                <option value="admin">Administrador (Gestiona escenarios NASA)</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success" style="width:100%;">Crear Cuenta</button>
    </form>
    <p style="margin-top:15px; text-align:center;">
        <a href="{{ url_for('login') }}" style="color:#38bdf8;">Volver al Inicio de Sesión</a>
    </p>
</div>
{% endblock %}
